<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="个人主页 · 简历 · 日志" />
<meta name="theme-color" content="#fbfbf9" />
<title>陆洋 · 个人主页</title>
<style>
/* ===================== 变量与基础 ===================== */
:root{
  --bg:#fbfbf9;
  --bg-soft:#f4f3ee;
  --text:#1b1b19;
  --muted:#7a786f;
  --line:#e6e4dc;
  --accent:#3b82f6;
  --code-bg:#f1f0ea;
  --wrap:780px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC",serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --radius:10px;
}
html[data-theme="dark"]{
  --bg:#131313;
  --bg-soft:#1b1b1a;
  --text:#e9e7e2;
  --muted:#9a978f;
  --line:#2b2b29;
  --accent:#3b82f6;
  --code-bg:#1e1e1c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-sans);font-size:16px;line-height:1.78;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
  transition:background-color .25s ease,color .25s ease;
}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
img{max-width:100%;height:auto;border-radius:var(--radius)}
::selection{background:var(--accent);color:var(--bg)}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* ===================== 顶栏 ===================== */
.site-head{
  position:sticky;top:0;z-index:30;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  backdrop-filter:saturate(150%) blur(8px);
}
.head-inner{display:flex;align-items:center;gap:20px;height:62px}
.brand{
  font-family:var(--font-serif);font-size:1.06rem;letter-spacing:.02em;
  font-weight:600;margin-right:auto;white-space:nowrap;
}
.nav{display:flex;gap:22px;font-size:.9rem}
.nav a{color:var(--muted);padding:4px 0;border-bottom:1px solid transparent;transition:color .18s,border-color .18s}
.nav a:hover{color:var(--text)}
.nav a.active{color:var(--text);border-bottom-color:var(--text)}
.theme-btn{
  font:inherit;font-size:.82rem;color:var(--muted);background:none;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;transition:color .18s,border-color .18s;
}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}

/* ===================== 通用区块 ===================== */
main.wrap{padding:0 24px 104px;flex:1 0 auto;width:100%}
.site-head,.site-foot{flex:0 0 auto}
section{margin-top:56px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.sec-head h2{
  font-size:.76rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:0;
}
.sec-head .more{margin-left:auto;font-size:.84rem;color:var(--muted)}
.sec-head .more:hover{color:var(--accent)}
.sec-head .count{margin-left:auto;font-size:.82rem;color:var(--muted)}
.sec-head .count + .more{margin-left:16px}
h1,h2,h3,h4{line-height:1.35}

/* ===================== 首页 hero ===================== */
.hero{padding:76px 0 8px}
.eyebrow{font-size:.86rem;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.name{
  font-family:var(--font-serif);font-weight:600;
  font-size:clamp(2.1rem,6vw,3.1rem);letter-spacing:-.015em;
  margin:0 0 18px;
}
.lead{font-size:1.04rem;color:var(--muted);max-width:34em;margin:0 0 26px;line-height:1.85}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  display:inline-block;font:inherit;font-size:.86rem;line-height:1;
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);
  background:none;color:var(--text);cursor:pointer;
  transition:border-color .18s,color .18s,background-color .18s;
}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.86}
.btn.ghost{color:var(--muted)}
.btn.danger{color:#b4402f;border-color:#d9b3aa}
.btn.danger:hover{background:#b4402f;color:#fff;border-color:#b4402f}

/* ===================== 日志列表 ===================== */
.post-list{list-style:none;margin:0;padding:0}
.post-row{
  display:grid;grid-template-columns:8rem 1fr;gap:22px;
  padding:20px 0;border-bottom:1px solid var(--line);
}
.post-row:first-child{border-top:1px solid var(--line)}
.post-row time{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);padding-top:.5em;letter-spacing:.02em}
.post-row h3{margin:0 0 .28em;font-size:1.1rem;font-weight:600;letter-spacing:-.005em}
.post-row h3 a{border-bottom:1px solid transparent;transition:border-color .18s}
.post-row h3 a:hover{border-bottom-color:var(--accent)}
.post-sum{margin:0;color:var(--muted);font-size:.92rem;line-height:1.72}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{
  font-size:.72rem;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;letter-spacing:.02em;
}
.tag.on{color:var(--accent);border-color:var(--accent)}
button.tag{cursor:pointer;background:none;font-family:inherit}
.empty{color:var(--muted);font-size:.92rem;padding:26px 0}

.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
.search{
  font:inherit;font-size:.9rem;color:var(--text);background:var(--bg-soft);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  min-width:240px;flex:1;outline:none;transition:border-color .18s;
}
.search:focus{border-color:var(--muted)}
.tagbar{display:flex;flex-wrap:wrap;gap:6px}

/* ===================== 简历 ===================== */
.resume-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;padding-top:56px}
.resume-head .name{font-size:clamp(1.8rem,4.6vw,2.5rem);margin-bottom:6px}
.resume-meta{font-size:.88rem;color:var(--muted);margin:0}
.print-btn{margin-left:auto}
.kv{display:grid;grid-template-columns:7.5rem 1fr;gap:14px 22px;font-size:.95rem}
.kv dt{color:var(--muted);font-size:.82rem;letter-spacing:.04em;padding-top:.28em}
.kv dd{margin:0 0 2px}
.plain{list-style:none;margin:0;padding:0}
.plain li{margin-bottom:7px;color:var(--text)}
.bullets{margin:.4em 0 0;padding-left:1.15em;color:var(--muted);font-size:.94rem}
.bullets li{margin-bottom:5px;line-height:1.75}

.skills{display:grid;gap:14px}
.skill-group{display:grid;grid-template-columns:7.5rem 1fr;gap:16px;align-items:start}
.skill-label{color:var(--muted);font-size:.82rem;letter-spacing:.04em;padding-top:.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:.82rem;border:1px solid var(--line);border-radius:6px;
  padding:2px 9px;color:var(--text);background:var(--bg-soft);
}

.timeline{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid var(--line)}
.timeline > li{position:relative;padding:0 0 26px 20px}
.timeline > li:last-child{padding-bottom:0}
.timeline > li::before{
  content:"";position:absolute;left:-24.5px;top:.62em;width:7px;height:7px;
  border-radius:50%;background:var(--bg);border:1px solid var(--muted);
}
.timeline .bullets{margin-top:.5em;padding-left:1.1em}
.timeline .bullets li{margin-bottom:4px;padding:0}
.tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.tl-head strong{font-size:1rem;font-weight:600}
.tl-period{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);margin-left:auto}
.tl-role{margin:.1em 0 0;font-size:.88rem;color:var(--accent)}

/* ===================== 文章页 ===================== */
.article{padding-top:52px}
.back{font-size:.84rem;color:var(--muted);display:inline-block;margin-bottom:22px}
.back:hover{color:var(--accent)}
.article h1{
  font-family:var(--font-serif);font-size:clamp(1.7rem,4.6vw,2.3rem);
  font-weight:600;letter-spacing:-.01em;margin:0 0 14px;
}
.article-meta{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  font-family:var(--font-mono);font-size:.76rem;color:var(--muted);
  padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:32px;
}
.article-body{font-size:1.02rem;line-height:1.9}
.article-body p{margin:0 0 1.25em}
.article-body h2{font-family:var(--font-serif);font-size:1.42rem;margin:1.9em 0 .7em;letter-spacing:-.01em}
.article-body h3{font-size:1.16rem;margin:1.6em 0 .6em}
.article-body h4{font-size:1.02rem;margin:1.4em 0 .5em;color:var(--muted)}
.article-body ul,.article-body ol{margin:0 0 1.25em;padding-left:1.3em;color:var(--text)}
.article-body li{margin-bottom:.35em}
.article-body blockquote{
  margin:1.4em 0;padding:.2em 0 .2em 18px;border-left:2px solid var(--accent);
  color:var(--muted);font-style:normal;
}
.article-body blockquote p{margin-bottom:.6em}
.article-body pre{
  background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;overflow-x:auto;font-size:.86rem;line-height:1.65;margin:0 0 1.3em;
}
.article-body code{font-family:var(--font-mono);font-size:.88em;background:var(--code-bg);padding:.12em .38em;border-radius:4px}
.article-body pre code{background:none;padding:0;font-size:1em}
.article-body hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
.article-body a{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.article-body del{color:var(--muted)}

/* ===================== 编辑器 ===================== */
.editor{padding-top:52px}
.editor h1{font-family:var(--font-serif);font-size:1.6rem;margin:0 0 24px}
.field{display:block;margin-bottom:18px}
.field > span{display:block;font-size:.8rem;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.field input[type=text],.field input[type=date],.field textarea,.field input:not([type]){
  width:100%;font:inherit;font-size:.95rem;color:var(--text);background:var(--bg-soft);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;outline:none;
  transition:border-color .18s;
}
.field textarea{line-height:1.75;resize:vertical;font-family:var(--font-mono);font-size:.88rem}
.field input:focus,.field textarea:focus{border-color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{font-size:.8rem;color:var(--muted);line-height:1.7;margin:10px 0 0}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);margin-bottom:22px}
.check input{accent-color:var(--accent);width:15px;height:15px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===================== 页脚 ===================== */
.site-foot{
  border-top:1px solid var(--line);padding:30px 0 44px;
  font-size:.82rem;color:var(--muted);
}
.foot-inner{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.foot-inner .spacer{margin-left:auto}
.site-foot a:hover{color:var(--accent)}

/* ===================== 提示条 ===================== */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:var(--text);color:var(--bg);font-size:.84rem;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===================== 小屏 ===================== */
@media (max-width:640px){
  .wrap{padding:0 18px}
  main.wrap{padding:0 18px 72px}
  .head-inner{height:56px;gap:12px}
  .nav{gap:14px;font-size:.84rem}
  .hero{padding:52px 0 0}
  .post-row{grid-template-columns:1fr;gap:6px;padding:18px 0}
  .post-row time{padding-top:0}
  .skill-group,.kv{grid-template-columns:1fr;gap:6px}
  .row2{grid-template-columns:1fr}
  .resume-head{padding-top:40px}
  .print-btn{margin-left:0}
  .search{min-width:0}
}

/* ===================== 打印（简历导出 PDF） ===================== */
@media print{
  :root{--bg:#fff;--text:#000;--muted:#444;--line:#bbb;--accent:#000;--bg-soft:#fff;--code-bg:#f4f4f4}
  html[data-theme="dark"]{--bg:#fff;--text:#000;--muted:#444;--line:#bbb;--accent:#000;--bg-soft:#fff}
  .site-head,.site-foot,.no-print,.toast{display:none !important}
  body{font-size:11.5pt;line-height:1.6}
  main{padding-bottom:0}
  section{margin-top:26px;page-break-inside:avoid}
  .hero,.resume-head{padding-top:0}
  a{text-decoration:none;color:#000}
  .chip{border-color:#ccc}
}
</style>

/* ============================================================
   2. 工具函数
   ============================================================ */
const $ = (sel, root) => (root || document).querySelector(sel);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function safeHref(u) {
  const v = String(u || "").trim();
  return /^(https?:\/\/|mailto:|#|\/|\.\/)/i.test(v) ? v : "#";
}

function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function fmtDate(s) {
  if (!s) return "";
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(s);
  return m[1] + " 年 " + Number(m[2]) + " 月 " + Number(m[3]) + " 日";
}

function readingTime(text) {
  const n = String(text || "").replace(/\s/g, "").length;
  return Math.max(1, Math.round(n / 400));
}

function uid() {
  return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ============================================================
   3. 极简 Markdown 渲染（够用即可，无外部依赖）
   ============================================================ */
const CJK = /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/;

function joinSoft(lines) {
  return lines.reduce((acc, line, i) => {
    if (i === 0) return line;
    const a = acc.slice(-1);
    const b = line.charAt(0);
    const needSpace = a && b && !(CJK.test(a) || CJK.test(b));
    return acc + (needSpace ? " " : "") + line;
  }, "");
}

function inlineMd(s) {
  let t = esc(s);
  const spans = [];
  t = t.replace(/`([^`]+)`/g, (m, code) => {
    spans.push(code);
    return "\u0000S" + (spans.length - 1) + "\u0000";
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, href) => {
    const safe = safeHref(href);
    if (safe === "#") return txt;
    return '<a href="' + safe + '" target="_blank" rel="noopener">' + txt + "</a>";
  });
  t = t.replace(/\u0000S(\d+)\u0000/g, (m, i) => "<code>" + spans[+i] + "</code>");
  return t;
}

function renderMd(src) {
  const codes = [];
  let text = String(src || "").replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => {
    codes.push(code.replace(/\n+$/, ""));
    return "@@CODE" + (codes.length - 1) + "@@";
  });

  const out = [];
  let para = [];
  let listType = null;
  let listItems = [];
  let quote = [];

  const flushPara = () => {
    if (para.length) {
      out.push("<p>" + inlineMd(joinSoft(para)) + "</p>");
      para = [];
    }
  };
  const flushList = () => {
    if (listType) {
      out.push("<" + listType + ">" + listItems.map(i => "<li>" + inlineMd(i) + "</li>").join("") + "</" + listType + ">");
      listType = null;
      listItems = [];
    }
  };
  const flushQuote = () => {
    if (quote.length) {
      out.push("<blockquote>" + renderMd(quote.join("\n")) + "</blockquote>");
      quote = [];
    }
  };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); };

  text.split(/\r?\n/).forEach(rawLine => {
    const line = rawLine.replace(/\s+$/, "");
    let m;

    if ((m = line.match(/^@@CODE(\d+)@@$/))) {
      flushAll();
      out.push("<pre><code>" + esc(codes[+m[1]]) + "</code></pre>");
      return;
    }
    if (!line.trim()) { flushAll(); return; }

    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      flushAll();
      const lv = Math.min(m[1].length + 1, 5);
      out.push("<h" + lv + ">" + inlineMd(m[2]) + "</h" + lv + ">");
      return;
    }
    if (/^(?:-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
      flushAll();
      out.push("<hr>");
      return;
    }
    if ((m = line.match(/^>\s?(.*)$/))) {
      flushPara(); flushList();
      quote.push(m[1]);
      return;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(m[1]);
      return;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(m[1]);
      return;
    }
    if (/^(?: {4}|\t)/.test(rawLine)) {
      flushAll();
      out.push("<pre><code>" + esc(rawLine.replace(/^(?: {4}|\t)/, "")) + "</code></pre>");
      return;
    }
    flushList(); flushQuote();
    para.push(line);
  });

  flushAll();
  return out.join("\n");
}

/* ============================================================
   4. 日志存储
   - 数据来源：内置 SEED_POSTS + 服务器上的 logs.json + 浏览器本地稿
   - 本地稿是"全量副本"，编辑/删除都作用于它；导出 logs.json 后上传即发布
   ============================================================ */
const STORE_KEY = "dsh.blog.posts.v2";
const THEME_KEY = "dsh.blog.theme";

const SEED_POSTS = [
  {
    id: "hello-world",
    title: "你好，世界",
    date: "2024-05-01",
    tags: ["公告", "使用说明"],
    draft: false,
    content: [
      "这是主页自带的示例日志。它同时是一份使用说明，读完可以删掉。",
      "",
      "## 怎么发表新日志",
      "",
      "1. 点页脚或日志页右上角的 **写日志** 按钮。",
      "2. 用 Markdown 写正文，保存后会存进当前浏览器。",
      "3. 点 **导出 logs.json**，把这个文件上传到服务器网站根目录，访客就能看到。",
      "",
      "> 站点是纯静态的：写作在浏览器里，发布靠上传一个 JSON 文件。没有数据库，也没有后台被拖库的风险。",
      "",
      "## 支持的写法",
      "",
      "- **加粗**、*斜体*、~~删除线~~、`行内代码`",
      "- [链接](https://example.com)",
      "- 引用、有序/无序列表、分隔线",
      "",
      "```bash",
      "scp -P 22 logs.json user@your-server:/var/www/blog/",
      "```",
      "",
      "简历内容在 `index.html` 里的 `SITE` 对象中修改，改完一起上传就生效。"
    ].join("\n")
  }
];

function readStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : null;
  } catch (e) {
    return null;
  }
}

function writeStore(arr) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(arr));
    return true;
  } catch (e) {
    toast("浏览器存储空间不足，请先导出备份");
    return false;
  }
}

const STATE = { posts: [], filter: "", tag: "" };

function sortPosts(arr) {
  return arr.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
}

async function loadPosts(useRemote) {
  let local = useRemote ? null : readStore();

  if (!local) {
    local = SEED_POSTS.slice();
    try {
      const res = await fetch("logs.json", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data && data.posts) || [];
        const clean = arr.filter(p => p && p.id && typeof p.title === "string");
        if (clean.length) local = clean;
      }
    } catch (e) {
      /* 直接双击本地文件打开时 fetch 会失败，忽略即可 */
    }
    writeStore(local);
  }

  STATE.posts = sortPosts(local);
}

function savePost(post) {
  const arr = readStore() || STATE.posts.slice();
  const i = arr.findIndex(p => p.id === post.id);
  if (i >= 0) arr[i] = post; else arr.push(post);
  if (!writeStore(arr)) return false;
  STATE.posts = sortPosts(arr);
  return true;
}

function deletePost(id) {
  const arr = (readStore() || STATE.posts.slice()).filter(p => p.id !== id);
  if (!writeStore(arr)) return false;
  STATE.posts = sortPosts(arr);
  return true;
}

function published() {
  return STATE.posts.filter(p => !p.draft);
}

function findPost(id) {
  return STATE.posts.find(p => p.id === id) || null;
}

function download(name, text, type) {
  const blob = new Blob([text], { type: type || "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function tagList(tags, active) {
  return (tags || []).map(t => (
    '<span class="tag' + (active === t ? " on" : "") + '">' + esc(t) + "</span>"
  )).join("");
}

function cleanInline(s) {
  return String(s || "")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[`*_~]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function summaryOf(p) {
  if (p.summary && String(p.summary).trim()) return cleanInline(p.summary).slice(0, 120);
  const blocks = String(p.content || "")
    .replace(/```[\s\S]*?```/g, "\n\n")
    .split(/\n\s*\n/);
  for (let i = 0; i < blocks.length; i++) {
    const t = blocks[i].trim();
    if (!t) continue;
    if (/^(#{1,6}\s|[-*+]\s|\d+[.)]\s|>)/.test(t)) continue;
    const c = cleanInline(t);
    if (c.length >= 12) return c.slice(0, 120);
  }
  return cleanInline(p.content).slice(0, 120);
}

function postRow(p) {
  const sum = summaryOf(p);
  return (
    '<li class="post-row">' +
      "<time>" + esc(p.date || "") + "</time>" +
      "<div>" +
        '<h3><a href="#/post/' + encodeURIComponent(p.id) + '">' + esc(p.title || "无标题") + "</a></h3>" +
        '<p class="post-sum">' + esc(sum) + (sum.length >= 120 ? "…" : "") + "</p>" +
        (p.tags && p.tags.length ? '<div class="tags">' + tagList(p.tags) + "</div>" : "") +
      "</div>" +
    "</li>"
  );
}

function renderListBox() {

  if (kw) {
    arr = arr.filter(p => (
      (p.title || "").toLowerCase().indexOf(kw) >= 0 ||
      (p.content || "").toLowerCase().indexOf(kw) >= 0 ||
      (p.tags || []).join(" ").toLowerCase().indexOf(kw) >= 0
    ));
  }
  box.innerHTML = arr.length ? arr.map(postRow).join("") : '<li class="empty">没有匹配的日志。</li>';
}

function viewPost(id) {

  return (

/* ============================================================
   6. 路由
   ============================================================ */
const app = $("#app");

function parts() {
  const h = location.hash.replace(/^#/, "");
  return h.split("/").filter(Boolean).map(decodeURIComponent);
}

function setNav(key) {
  document.querySelectorAll("#nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.nav === key);
  });
}

function render(scroll) {
  const p = parts();
  let html = "";
  let title = SITE.name;

  if (p.length === 0) {
    html = viewHome();
    title = SITE.name + " · " + SITE.headline;
    setNav("home");
  } else if (p[0] === "resume") {
    html = viewResume();
    title = "简历 · " + SITE.name;
    setNav("resume");
  } else if (p[0] === "blog") {
    html = viewBlog();
    title = "日志 · " + SITE.name;
    setNav("blog");
  } else if (p[0] === "post" && p[1]) {
    html = viewPost(p[1]);
    const post = findPost(p[1]);
    title = (post ? post.title : "找不到日志") + " · " + SITE.name;
    setNav("blog");
  } else if (p[0] === "write") {
    html = viewWrite("");
    title = "写日志 · " + SITE.name;
    setNav("blog");
  } else if (p[0] === "edit" && p[1]) {
    html = viewWrite(p[1]);
    title = "编辑日志 · " + SITE.name;
    setNav("blog");
  } else {
    html = viewNotFound();
    title = "页面不存在 · " + SITE.name;
  }

  app.innerHTML = html;
  document.title = title;
  if (scroll !== false) window.scrollTo(0, 0);
  afterRender(p);
}

function afterRender(p) {
  if (p[0] === "blog") {
    renderListBox();
    const q = $("#q");
    if (q) {
      q.addEventListener("input", () => { STATE.filter = q.value; renderListBox(); });
    }
    const bar = $("#tagbar");
    if (bar) {
      bar.addEventListener("click", e => {
        const b = e.target.closest("[data-tag]");
        if (!b) return;
        STATE.tag = b.dataset.tag;
        bar.querySelectorAll("[data-tag]").forEach(x => x.classList.toggle("on", x.dataset.tag === STATE.tag));
        renderListBox();
      });
    }
  }
  if (p[0] === "write" || p[0] === "edit") {
    const form = $("#postForm");
    if (form) {
      form.addEventListener("submit", onSavePost);
      const ta = form.querySelector("textarea");
      if (ta && !ta.value) ta.focus();
    }
    const file = $("#importFile");
    if (file) file.addEventListener("change", onImportFile);
  }
}

function onSavePost(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const title = String(fd.get("title") || "").trim();
  const content = String(fd.get("content") || "");
  if (!title) { toast("标题不能为空"); return; }
  if (!content.trim()) { toast("正文不能为空"); return; }

  const tags = String(fd.get("tags") || "")
    .split(/[,，]/)
    .map(s => s.trim())
    .filter(Boolean);

  const id = form.dataset.id || uid();
  const post = {
    id: id,
    title: title,
    date: String(fd.get("date") || todayStr()),
    tags: tags,
    draft: !!fd.get("draft"),
    content: content
  };

  if (!savePost(post)) return;
  toast(post.draft ? "已保存为草稿" : "已保存，记得导出并上传 logs.json");
  location.hash = post.draft ? "#/edit/" + encodeURIComponent(id) : "#/post/" + encodeURIComponent(id);
}

function onImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      const arr = Array.isArray(data) ? data : (data && data.posts) || [];
      const clean = arr.filter(p => p && p.id && typeof p.title === "string");
      if (!clean.length) { toast("这个文件里没有日志"); return; }
      if (!writeStore(clean)) return;
      STATE.posts = sortPosts(clean);
      toast("已导入 " + clean.length + " 篇，当前浏览器已更新");
      render(false);
    } catch (err) {
      toast("JSON 解析失败");
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   7. 全局事件
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "theme") {
    e.preventDefault();
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    return;
  }
  if (act === "print") {
    e.preventDefault();
    window.print();
    return;
  }
  if (act === "export") {
    e.preventDefault();
    download("logs.json", JSON.stringify(STATE.posts, null, 2) + "\n");
    toast("已下载 logs.json（" + STATE.posts.length + " 篇）");
    return;
  }
  if (act === "import") {
    e.preventDefault();
    const f = $("#importFile");
    if (f) f.click();
    return;
  }
  if (act === "reload") {
    e.preventDefault();
    if (!confirm("用服务器上的 logs.json 覆盖本机草稿？本机未导出的改动会丢失。")) return;
    loadPosts(true).then(() => {
      toast("已重新载入");
      render(false);
    });
    return;
  }
  if (act === "delete") {
    e.preventDefault();
    const id = el.dataset.id;
    if (!id) return;
    if (!confirm("删除这篇日志？")) return;
    if (!deletePost(id)) return;
    toast("已删除，记得重新导出 logs.json");
    location.hash = "#/blog";
  }
});

window.addEventListener("hashchange", () => render());

/* ============================================================
   8. 主题
   ============================================================ */
function setTheme(name) {
  document.documentElement.dataset.theme = name;
  const btn = $("#themeBtn");
  if (btn) btn.textContent = name === "dark" ? "日间" : "夜间";
  try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", name === "dark" ? "#131313" : "#fbfbf9");
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (!saved) {
    saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  setTheme(saved);
  const btn = $("#themeBtn");
  if (btn) btn.dataset.act = "theme";
})();

/* ============================================================
   9. 启动
   ============================================================ */
(function boot() {
  const el = $("#brandLink");
  if (el) el.textContent = SITE.name;
  const copy = $("#footCopy");
  if (copy) copy.textContent = "© " + new Date().getFullYear() + " " + SITE.name;
  loadPosts(false).then(() => render());
})();
</script>
</body>
</html>
