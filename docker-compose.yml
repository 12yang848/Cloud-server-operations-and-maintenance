version: '3.8'
services:
  nginx:
    image: nginx:latest
    container_name: my-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8080:80"
    volumes:
      - /var/www/html:/usr/share/nginx/html
      - /root/nginx-conf/default.conf:/etc/nginx/conf.d/default.conf
      - /root/nginx-conf/ssl:/etc/nginx/ssl
    networks:
      - my-net
    restart: always

  mysql:
    image: mysql:8.0
    container_name: my-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: LuYang@2026
    volumes:
      - /root/mysql-data:/var/lib/mysql
    networks:
      - my-net
    restart: always

networks:
  my-net:
    name: my-net
    driver: bridge